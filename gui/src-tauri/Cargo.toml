[package]
name = "wozzle-gui"
description = "Apple II disk images: wozzle, wozit and wozmosis in a window"
authors = ["Jorj Bauer"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wozzle_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-drag = "2.1.1"

# For catching a quit from the Dock, a logout or AppleScript (see lib.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
